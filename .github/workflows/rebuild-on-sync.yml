name: Rebuild após sync do Instagram

# A Edge Function supabase/functions/instagram-sync dispara um repository_dispatch
# depois de gravar posts novos. Como as páginas são pré-renderizadas no build, o
# conteúdo novo só aparece no site depois de um rebuild.
#
# Antes este workflow reconstruía o projeto e publicava no GitHub Pages a partir
# de ./out — alvo errado desde que o site foi para a Vercel, e ./out nem é mais
# gerado (o next.config.ts não tem `output: 'export'`). Agora ele só aciona um
# Deploy Hook, e quem constrói é a Vercel.
#
# Para ativar: criar um Deploy Hook em
#   Vercel > Project moveo-filmes > Settings > Git > Deploy Hooks
# e salvar a URL como o secret VERCEL_DEPLOY_HOOK_URL no repositório.
# Sem o secret o workflow avisa e passa, em vez de falhar a cada sync.

on:
  repository_dispatch:
    types: [instagram-sync]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: Acionar deploy na Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
            echo "::warning::Secret VERCEL_DEPLOY_HOOK_URL ausente — rebuild não disparado. Ver README-INFRA.md."
            exit 0
          fi

          status=$(curl -sS -o /tmp/hook.json -w '%{http_code}' --max-time 30 \
            -X POST "$DEPLOY_HOOK_URL")

          echo "HTTP ${status}"
          head -c 300 /tmp/hook.json || true
          echo

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::error::Deploy Hook respondeu ${status}."
            exit 1
          fi

          echo "Deploy disparado na Vercel."
